services:
  nginx:
    image: nginx:1.28.2
    ports:
      - '81:80'
    volumes:
      - './nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro'
      - './src:/var/www/${PROJECT_NAME}'
    depends_on:
      php:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      - PROJECT_NAME=${PROJECT_NAME}
  php:
    build:
      context: dockerfiles
      dockerfile: php.Dockerfile
      args:
        PROJECT_NAME: ${PROJECT_NAME}
    volumes:
      - './src:/var/www/${PROJECT_NAME}'
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
  db:
    image: 'postgres:12'
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - './containers_data/db_data:/var/lib/postgresql/data'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  composer:
    profiles: ["tools"]
    build:
      context: dockerfiles
      dockerfile: composer.Dockerfile
      args:
        PROJECT_NAME: ${PROJECT_NAME}
    volumes:
      - './src:/var/www/${PROJECT_NAME}'
  artisan:
    profiles: ["tools"]
    build:
      context: dockerfiles
      dockerfile: php.Dockerfile
      args:
        PROJECT_NAME: ${PROJECT_NAME}
    volumes:
      - './src:/var/www/${PROJECT_NAME}'
    entrypoint:
      - php
      - /var/www/${PROJECT_NAME}/artisan
  npm:
    image: node:20.19.5-bullseye
    working_dir: /var/www/${PROJECT_NAME}
    entrypoint: ["npm"]
    volumes:
      - './src:/var/www/${PROJECT_NAME}'
  telegram-bot:
    build:
      context: dockerfiles
      dockerfile: php.Dockerfile
      args:
        PROJECT_NAME: ${PROJECT_NAME}
    volumes:
      - './src:/var/www/${PROJECT_NAME}'
    command: php artisan telegram:polling
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  scheduler:
    build:
      context: dockerfiles
      dockerfile: php.Dockerfile
      args:
        PROJECT_NAME: ${PROJECT_NAME}
    volumes:
      - './src:/var/www/${PROJECT_NAME}'
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
