services:
  nginx:
    image: nginx
    ports:
      - '81:80'
    volumes:
      - './nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro'
      - './src:/var/www/laradock'
    depends_on:
      - db
      - php
      - composer
      - artisan
    environment:
      - PROJECT_NAME=${PROJECT_NAME}
  php:
    ports:
      - '8080:8080'
    build:
      context: dockerfiles
      dockerfile: php.Dockerfile
      args:
        PROJECT_NAME: ${PROJECT_NAME}
    volumes:
      - './src:/var/www/${PROJECT_NAME}'
  db:
    container_name: postgres_laravel
    image: 'postgres:12'
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=project
    volumes:
      - './containers_data/db_data:/var/lib/postgresql/data'
  pgadmin:
    image: dpage/pgadmin4
    ports:
      - '5050:80'
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=password
    volumes:
      - './containers_data/pgadmin_data:/var/lib/pgadmin'
    depends_on:
      - db
  #  mysql:
  #    image: mysql:8.0
  #    ports:
  #      - "3316:3306"
  #    env_file:
  #      - env/mysql.env
  #    volumes:
  #      - './containers_data/mysql_data:/var/lib/mysql'
  composer:
    build:
      context: dockerfiles
      dockerfile: composer.Dockerfile
      args:
        PROJECT_NAME: ${PROJECT_NAME}
    volumes:
      - './src:/var/www/${PROJECT_NAME}'
  artisan:
    build:
      context: dockerfiles
      dockerfile: php.Dockerfile
    volumes:
      - './src:/var/www/${PROJECT_NAME}'
    entrypoint:
      - php
      - /var/www/${PROJECT_NAME}/artisan
  npm:
    image: node:20
    working_dir: /var/www/${PROJECT_NAME}
    entrypoint: ["npm"]
    volumes:
      - './src:/var/www/${PROJECT_NAME}'
  redis:
    image: redis:latest
    command: redis-server --appendonly yes
    volumes:
      - .docker/redis/data:/data
    ports:
      - 6379:6379
