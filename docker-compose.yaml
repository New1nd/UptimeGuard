services:
  nginx:
    image: nginx:1.28.2
    ports:
      - '81:80'
    volumes:
      - './nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro'
      - './src:/var/www/${PROJECT_NAME}'
    depends_on:
      php:
        condition: service_started
      db:
        condition: service_healthy
    environment:
      - PROJECT_NAME=${PROJECT_NAME}
    networks:
      - default
      - monitoring
  php:
    build:
      context: dockerfiles
      dockerfile: php.Dockerfile
      args:
        PROJECT_NAME: ${PROJECT_NAME}
    volumes:
      - './src:/var/www/${PROJECT_NAME}'
    networks:
      - default
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
  db:
    image: 'postgres:12'
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - './containers_data/db_data:/var/lib/postgresql/data'
    networks:
      - default
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  pgadmin:
    image: dpage/pgadmin4:9.13.0
    ports:
      - '5050:80'
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=password
    volumes:
      - './containers_data/pgadmin_data:/var/lib/pgadmin'
    depends_on:
      - db
  #  mysql:
  #    image: mysql:8.0
  #    ports:
  #      - "3316:3306"
  #    env_file:
  #      - env/mysql.env
  #    volumes:
  #      - './containers_data/mysql_data:/var/lib/mysql'
  composer:
    profiles: ["tools"]
    build:
      context: dockerfiles
      dockerfile: composer.Dockerfile
      args:
        PROJECT_NAME: ${PROJECT_NAME}
    volumes:
      - './src:/var/www/${PROJECT_NAME}'
  artisan:
    profiles: ["tools"]
    build:
      context: dockerfiles
      dockerfile: php.Dockerfile
      args:
        PROJECT_NAME: ${PROJECT_NAME}
    volumes:
      - './src:/var/www/${PROJECT_NAME}'
    entrypoint:
      - php
      - /var/www/${PROJECT_NAME}/artisan
  npm:
    image: node:20.19.5-bullseye
    working_dir: /var/www/${PROJECT_NAME}
    entrypoint: ["npm"]
    volumes:
      - './src:/var/www/${PROJECT_NAME}'
  telegram-bot:
    build:
      context: dockerfiles
      dockerfile: php.Dockerfile
      args:
        PROJECT_NAME: ${PROJECT_NAME}
    volumes:
      - './src:/var/www/${PROJECT_NAME}'
    command: php artisan telegram:polling
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
  scheduler:
    build:
      context: dockerfiles
      dockerfile: php.Dockerfile
      args:
        PROJECT_NAME: ${PROJECT_NAME}
    volumes:
      - './src:/var/www/${PROJECT_NAME}'
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
#  redis:
#    image: redis:7.4.8
#    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
#    volumes:
#      - './containers_data/redis:/data'
#    ports:
#      - 6379:6379
#    networks:
#      - default
#      - monitoring
#    healthcheck:
#      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
#      interval: 10s
#      timeout: 5s
#      retries: 3
  grafana:
    image: grafana/grafana:12.3.5
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin  # ⚠️ Смените в продакшене!
      - GF_SERVER_HTTP_PORT=3000
    restart: unless-stopped
    networks:
      - monitoring
