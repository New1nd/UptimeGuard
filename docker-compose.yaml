services:
  nginx:
    image: nginx
    ports:
      - '81:80'
    volumes:
      - './nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro'
      - './src:/var/www/project'
    #      - './certbot/www/:/var/www/project/:ro'
    depends_on:
      - db
      - php
      - composer
      - artisan
  certbot:
    image: certbot/certbot:latest
    volumes:
      - './certbot/www/:/var/www/project/:rw'
      - './certbot/conf/:/etc/letsencrypt/:rw'
  php:
    ports:
      - '8080:8080'
    build:
      context: dockerfiles
      dockerfile: php.Dockerfile
    volumes:
      - './src:/var/www/project'
  db:
    container_name: postgres_laravel
    image: 'postgres:12'
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=project
    volumes:
      - './db_data:/var/lib/postgresql/data'
  pgadmin:
    image: dpage/pgadmin4
    ports:
      - '5050:80'
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=password
    #    volumes:
    #      - './pgadmin:/var/lib/pgadmin'
    depends_on:
      - db
  #  mysql:
  #    image: mysql:8.0
  #    ports:
  #      - "3316:3306"
  #    env_file:
  #      - env/mysql.env
  #    volumes:
  #      - db_data:/var/lib/mysql
  composer:
    build:
      context: dockerfiles
      dockerfile: composer.Dockerfile
    volumes:
      - './src:/var/www/project'
  artisan:
    build:
      context: dockerfiles
      dockerfile: php.Dockerfile
    volumes:
      - './src:/var/www/project'
    entrypoint:
      - php
      - /var/www/project/artisan
  npm:
    image: node:20
    working_dir: /var/www/project
    entrypoint: ["npm"]
    volumes:
      - './src:/var/www/project'
  redis:
    image: redis:latest
    command: redis-server --appendonly yes
    volumes:
      - .docker/redis/data:/data
    ports:
      - 6379:6379
