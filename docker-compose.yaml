services:
  nginx:
    image: nginx:1.28.2
    ports:
      - '81:80'
    volumes:
      - './nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro'
      - './src:/var/www/${PROJECT_NAME}'
    depends_on:
      - db
      - php
    environment:
      - PROJECT_NAME=${PROJECT_NAME}
  php:
    build:
      context: dockerfiles
      dockerfile: php.Dockerfile
      args:
        PROJECT_NAME: ${PROJECT_NAME}
    volumes:
      - './src:/var/www/${PROJECT_NAME}'
  db:
    image: 'postgres:12'
    env_file:
      - env/postgres.env
    volumes:
      - './containers_data/db_data:/var/lib/postgresql/data'
  pgadmin:
    image: dpage/pgadmin4:9.13.0
    ports:
      - '5050:80'
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=password
    volumes:
      - './containers_data/pgadmin_data:/var/lib/pgadmin'
    depends_on:
      - db
  #  mysql:
  #    image: mysql:8.0
  #    ports:
  #      - "3316:3306"
  #    env_file:
  #      - env/mysql.env
  #    volumes:
  #      - './containers_data/mysql_data:/var/lib/mysql'
  composer:
    profiles: ["tools"]
    build:
      context: dockerfiles
      dockerfile: composer.Dockerfile
      args:
        PROJECT_NAME: ${PROJECT_NAME}
    volumes:
      - './src:/var/www/${PROJECT_NAME}'
  artisan:
    profiles: ["tools"]
    build:
      context: dockerfiles
      dockerfile: php.Dockerfile
      args:
        PROJECT_NAME: ${PROJECT_NAME}
    volumes:
      - './src:/var/www/${PROJECT_NAME}'
    entrypoint:
      - php
      - /var/www/${PROJECT_NAME}/artisan
  npm:
    image: node:20.19.5-bullseye
    working_dir: /var/www/${PROJECT_NAME}
    entrypoint: ["npm"]
    volumes:
      - './src:/var/www/${PROJECT_NAME}'
  redis:
    image: redis:7.4.8
    command: redis-server --appendonly yes
    volumes:
      - './containers_data/redis:/data'
    ports:
      - 6379:6379
  grafana:
    image: grafana/grafana:12.3.5
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin  # ⚠️ Смените в продакшене!
      - GF_SERVER_HTTP_PORT=3000
    restart: unless-stopped
    networks:
      - monitoring
#  reverb:
#    build:
#      context: dockerfiles
#      dockerfile: reverb.Dockerfile
#    container_name: reverb
#    ports:
#      - '8080:8080'
#    volumes:
#      - './src:/var/www/${PROJECT_NAME}'
#    working_dir: /var/www/${PROJECT_NAME}
#    depends_on:
#      - php
#      - nginx
volumes:
  db_data: null
  grafana_data:

networks:
  monitoring:
    driver: bridge
